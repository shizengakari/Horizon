name: Release Horizon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: バージョンとタグの同期
        id: versioning
        run: node scripts/prepare-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust ツールチェーンのセットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: Rust ビルドキャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust ネイティブバイナリ (horizon.exe) のビルド
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: リリース成果物 (horizon.exe & ZIP) の配置
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "src-tauri\target\release\horizon.exe" -Destination "dist\horizon.exe" -Force
          Compress-Archive -Path "dist\horizon.exe" -DestinationPath "dist\horizon-windows-x64.zip" -Force

      - name: GitHub Releases へ公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            dist/horizon.exe
            dist/horizon-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
